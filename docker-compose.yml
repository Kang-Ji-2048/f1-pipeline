services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: f1user
      POSTGRES_PASSWORD: f1pass
      POSTGRES_DB: f1data
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U f1user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Initialises the schema, then exits. Run ingestion on demand, e.g.:
  #   docker compose run --rm pipeline ingest-all --season 2025
  pipeline:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://f1user:f1pass@db:5432/f1data
    command: ["init-db"]

  dashboard:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://f1user:f1pass@db:5432/f1data
    entrypoint: []
    command:
      - streamlit
      - run
      - src/dashboard/app.py
      - --server.address=0.0.0.0
      - --server.port=8501
    ports:
      - "8501:8501"

volumes:
  pgdata:
