[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "f1-data-pipeline"
version = "1.0.0"
description = "End-to-end data pipeline for F1 race telemetry, timing, and results"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "psycopg2-binary>=2.9,<3",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "pydantic>=2.5,<3",
    "tenacity>=8.2,<9",
    "structlog>=24.1,<25",
    "click>=8.1,<9",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=4.1,<6",
    "pytest-mock>=3.12,<4",
    "ruff>=0.3,<1",
    "mypy>=1.8,<2",
]

[project.scripts]
f1-pipeline = "src.pipeline.cli:main"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -v"
markers = [
    "integration: marks tests requiring a database connection",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
