name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly deployment trigger — every Monday at 06:00 UTC
    - cron: "0 6 * * 1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Install the package so mypy can resolve first-party and dependency imports.
      - run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check src/ tests/
      - name: Ruff format check
        run: ruff format --check src/ tests/
      - name: Type check (mypy --strict)
        run: mypy --strict src/

  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: f1user
          POSTGRES_PASSWORD: f1pass
          POSTGRES_DB: f1data
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U f1user"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://f1user:f1pass@localhost:5432/f1data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev,ml]"
      - name: Run tests
        run: pytest --cov=src --cov-report=xml --cov-report=term-missing
      - name: Upload coverage
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: f1user
          POSTGRES_PASSWORD: f1pass
          POSTGRES_DB: f1data
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U f1user"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://f1user:f1pass@localhost:5432/f1data
      # Surfaced from a secret so the S3 step can be conditionally skipped when
      # AWS is not configured (secrets cannot be referenced directly in `if:`).
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[aws]"
      - name: Run Alembic migrations
        run: alembic upgrade head
      - name: Ingest current season
        run: f1-pipeline ingest-ergast --season 2025
      - name: Export season to S3 (only when AWS is configured)
        if: env.S3_BUCKET != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
        run: f1-pipeline export-s3 --season 2025
